name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 54329
      DB_DATABASE: promptedit
      DB_USERNAME: promptedit
      DB_PASSWORD: secret

    services:
      pgsql:
        image: postgres:17
        env:
          POSTGRES_USER: promptedit
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: promptedit
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U promptedit -d promptedit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure application
        run: cp .env.example .env && php artisan key:generate

      - name: Create test database
        run: PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE" -c 'CREATE DATABASE promptedit_test OWNER promptedit;'

      - name: Build frontend
        run: npm ci && npm run build

      - name: Run CI Checks
        run: composer ci:check
